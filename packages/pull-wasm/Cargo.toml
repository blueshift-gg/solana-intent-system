[package]
name = "pull-wasm"
version = "0.0.1"
edition = "2021"
description = "pull-core for JavaScript: terms codec and canonical text"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The cluster the SDK builds terms for; must match the program build.
devnet = ["pull-core/devnet"]
localnet = ["pull-core/localnet"]

[dependencies]
five8 = "1.0.0"
pull-core = { workspace = true, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
