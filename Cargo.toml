[workspace]
resolver = "2"
members = ["program", "packages/mandate-core", "packages/mandate-wasm", "tests", "tests/caller"]

[workspace.dependencies]
mandate-core = { path = "packages/mandate-core", version = "0.0.1" }
pinocchio = { version = "=0.8.4", default-features = false }

# Limits and bounds use checked arithmetic as well as runtime overflow checks.
[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true
